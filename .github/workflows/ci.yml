# v1 CI (T-019): lint + tests for backend and frontend on every push and PR.
# Extended in T-077 with migrations up/down, gitleaks, image build and Trivy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16.4
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d blog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENV: ci
      DATABASE_URL: postgresql+psycopg://blog:blog@localhost:5432/blog
      TEST_DATABASE_URL: postgresql+psycopg://blog:blog@localhost:5432/blog_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (eslint + prettier + tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (frozen lockfile)
        run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: Prettier
        run: npx prettier --check .
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
